name: Build Gamepad Mapper APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamepad-mapper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Pack source code
        run: zip -r gamepad-mapper-source.zip app build.gradle.kts settings.gradle.kts gradle.properties .gitignore
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gamepad-mapper-source
          path: gamepad-mapper-source.zip
